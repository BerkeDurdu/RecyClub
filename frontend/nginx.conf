# RecyClub Frontend — nginx config (SAD v2 §6.1 Frontend Container)
# - Serves the React SPA build
# - SPA fallback: every unknown path returns index.html so React Router handles it
# - /api proxies to the backend container on the compose network

server {
  listen       80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # Static assets — long cache for hashed files
  location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # API proxy → backend container (Docker compose service name 'backend')
  location /api/ {
    proxy_pass         http://backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health for nginx itself
  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
